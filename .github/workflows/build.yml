name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:        # позволяет запускать сборку вручную из вкладки Actions

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Забираем код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем JDK 17 (нужен для AGP 8.x и Kotlin 1.9)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Кэшируем Gradle, чтобы сборка была быстрее
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Делаем gradlew исполняемым (на Linux это обязательно)
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. Собираем debug APK
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. Загружаем APK как артефакт
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Build Release APK (unsigned)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')   # запускается только при теге вида v1.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Собираем release APK без подписи (assembleRelease)
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
